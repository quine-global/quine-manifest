name: Sync forks

# Pulls our forks' upstreams into them (README, "Syncing forks"): for now
# quine-global/pocketbase's three (sync/pocketbase.sh). Here rather than in
# the forks themselves, so those keep Actions off: they carry upstream's
# workflows, which the upstream tags we push would otherwise set off.
#
# Daily, and by hand. A merge that conflicts fails the run, with nothing
# pushed.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency: {group: sync-forks, cancel-in-progress: false}

jobs:
  pocketbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull pocketbase's upstreams into it
        env:
          FORGEJO_TOKEN: ${{ secrets.QUINE_REPOS_FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?QUINE_REPOS_FORGEJO_TOKEN secret not set}"
          git --version; node --version; npm --version
          sync/pocketbase.sh
