# Where every Quine repo lives, on GitHub and on Forgejo.
# `python3.14 quine-repos.py` shows drift; `--apply` fixes it. See README.md.

forgejo_url = "https://forge.in.quineglobal.com"

# Renovate (petersweb-infra's nixos/renovate.nix): dependency update PRs on
# the forge. For each repo it covers, the script makes its `user` a
# collaborator with write access and adds the webhook that wakes it; Renovate
# finds those repos itself and opens a "Configure Renovate" PR in each new one
# (its renovate.json, extending renovate/default.json here). By default it
# covers our own repos in these buckets, not forks of other projects (whose
# dependencies come with upstream merges) or mirrors; a repo's
# `renovate = true|false` overrides that.
[renovate]
user = "renovate"
buckets = ["main", "labs"]
webhook = "http://10.89.0.1:9055/hooks/renovate" # the forge VM, as Forgejo's container sees it

# A bucket is a pair of orgs, one per host. Moving a repo between buckets
# transfers it on both sides. The boneyard is where retired repos go; they
# stay unarchived and mirrored like everything else.
#
# mirror_token_file: GitHub fine-grained token (resource owner = the bucket's
# GitHub org, Contents + Workflows read/write) that Forgejo push mirrors use.
[buckets.main]
github = "quine-global"
forgejo = "quine-global"
mirror_token_file = "~/.config/forgejo/github-mirror-token" # expires 2027-10-12

[buckets.labs]
github = "quine-global-labs"
forgejo = "quine-global-labs"
mirror_token_file = "~/.config/forgejo/github-mirror-token-labs" # expires 2026-11-10

[buckets.boneyard]
github = "quine-global-boneyard"
forgejo = "quine-global-boneyard"
archived = false # unarchive anything that lands here
mirror_token_file = "~/.config/forgejo/github-mirror-token-boneyard" # expires 2027-01-09

# Per-repo keys (all optional except bucket):
#   primary = "forgejo" (default): Forgejo is canonical, push-mirrored to GitHub
#           | "github": GitHub is canonical, Forgejo holds a pull mirror
#   github  = false     Forgejo-only repo, nothing on GitHub
#   import  = "full" (default: issues, PRs, releases, wiki) | "code" (git only).
#             Use "code" for repos with big release assets: full imports that
#             take over ~60s die at nginx's proxy timeout and leave the repo
#             stuck "migrating".
#   archived = true|false  archive / unarchive on both sides. Unset: leave it, but
#             report repos that are archived on GitHub (never unarchived silently).
#   renovate = true|false  Renovate on / off ([renovate] above). Unset: on for
#             our own repos in its buckets, off for forks (forked_from) and
#             mirrors.
#   actions = true|false  Forgejo Actions on / off. Unset: off for upstream
#             mirrors (they carry upstream's CI, which would sit "waiting" for
#             runners we don't have), left alone for everything else.
#   forked_from = "owner/repo" (GitHub) or a URL: Forgejo's description says
#             "(Forked from …)". GitHub descriptions of Forgejo-primary repos
#             always say "(Mirror of <Forgejo URL>)" instead.
#   upstream = "<url>"  third-party source: Forgejo pull-mirrors it and push-mirrors on to GitHub

# ── main ─────────────────────────────────────────────────────────────────────
[repos.quintodrome]
bucket = "main"
forked_from = "navidrome/navidrome"
renovate = true # its renovate.json leaves Navidrome's own go.mod to upstream merges
import = "code" # ~3.3 GB of release assets on GitHub, left there

[repos.hyper]
bucket = "main"
forked_from = "vercel/hyper"
primary = "github"
import = "code" # ~20 GB of release assets on GitHub

[repos."quintodrome.quineglobal.com"]
bucket = "main"
forked_from = "quine-global/hyper.quineglobal.com"

[repos."hyper.quineglobal.com"]
bucket = "main"

[repos."linux.quineglobal.com"] # private for now
bucket = "main"
github = false

[repos.site-image] # the build-and-bump action the *.quineglobal.com sites use
bucket = "main"
github = false

# Our fork of rgit, the read-only git web frontend behind
# git.quinefoundation.com; its deploy workflow pins the image in
# petersweb-infra, like the websites'.
[repos.rgit]
bucket = "main"
github = false
forked_from = "w4/rgit"

# The container image the forge's ubuntu-latest jobs run in: official
# node:24-bookworm plus a few tools, in place of catthehacker's image. Its
# deploy workflow pins the image in petersweb-infra's nixos/linux.nix.
[repos.ci-image]
bucket = "main"
github = false

# Our fork of git-sync, with --exechook-path (the hook only for commits that
# change given paths); petersweb-infra builds it as a patch on upstream's
# release (nixos/git-sync/). Actions off: it carries upstream's CI, which
# builds in upstream's Docker images and fails on our runners.
[repos.git-sync]
bucket = "main"
github = false
forked_from = "kubernetes/git-sync"
actions = false

# Public, so other repos' workflows can load it (`uses:`); it holds the
# action and build scripts only, no secrets. (OK'd 2026-11-03.)
[repos.app-build] # the RPM build action our in-house apps use
bucket = "main"
github = false

[repos.guix-builds]
bucket = "main"

[repos.quine-core]
bucket = "main"

[repos.electron-link]
bucket = "main"
forked_from = "atom/electron-link"

[repos.ava]
bucket = "main"
forked_from = "avajs/ava"

[repos.ava-typescript]
