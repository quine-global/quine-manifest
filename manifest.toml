# Where every Quine repo lives, on GitHub and on Forgejo.
# `python3.14 quine-repos.py` shows drift; `--apply` fixes it. See README.md.

forgejo_url = "https://forge.quinefoundation.com"

# A bucket is a pair of orgs, one per host. Moving a repo between buckets
# transfers it on both sides. The boneyard is where retired repos go; they
# stay unarchived and mirrored like everything else.
#
# mirror_token_file: GitHub fine-grained token (resource owner = the bucket's
# GitHub org, Contents + Workflows read/write) that Forgejo push mirrors use.
[buckets.main]
github = "quine-global"
forgejo = "quine-global"
mirror_token_file = "~/.config/forgejo/github-mirror-token" # expires 2027-10-12

[buckets.labs]
github = "quine-global-labs"
forgejo = "quine-global-labs"
mirror_token_file = "~/.config/forgejo/github-mirror-token-labs" # expires 2026-11-10

[buckets.boneyard]
github = "quine-global-boneyard"
forgejo = "quine-global-boneyard"
archived = false # unarchive anything that lands here
mirror_token_file = "~/.config/forgejo/github-mirror-token-boneyard"

# Per-repo keys (all optional except bucket):
#   primary = "forgejo" (default): Forgejo is canonical, push-mirrored to GitHub
#           | "github": GitHub is canonical, Forgejo holds a pull mirror
#   github  = false     Forgejo-only repo, nothing on GitHub
#   import  = "full" (default: issues, PRs, releases, wiki) | "code" (git only).
#             Use "code" for repos with big release assets: full imports that
#             take over ~60s die at nginx's proxy timeout and leave the repo
#             stuck "migrating".
#   archived = true|false  archive / unarchive on both sides. Unset: leave it, but
#             report repos that are archived on GitHub (never unarchived silently).
#   forked_from = "owner/repo" (GitHub) or a URL: noted in both descriptions
#   upstream = "<url>"  third-party source: Forgejo pull-mirrors it and push-mirrors on to GitHub

# ── main ─────────────────────────────────────────────────────────────────────
[repos.quintodrome]
bucket = "main"
forked_from = "navidrome/navidrome"
import = "code" # ~3.3 GB of release assets on GitHub, left there

[repos.hyper]
bucket = "main"
forked_from = "vercel/hyper"
primary = "github"
import = "code" # ~20 GB of release assets on GitHub

[repos."quintodrome.quineglobal.com"]
bucket = "main"
forked_from = "quine-global/hyper.quineglobal.com"

[repos."hyper.quineglobal.com"]
bucket = "main"

[repos.guix-builds]
bucket = "main"

[repos.quine-core]
bucket = "main"

[repos.electron-link]
bucket = "main"
forked_from = "atom/electron-link"

[repos.ava]
bucket = "main"
forked_from = "avajs/ava"

[repos.ava-typescript]
bucket = "main"
forked_from = "avajs/typescript"

[repos.electron-drag-click]
bucket = "main"
forked_from = "gerhardberger/electron-drag-click"

[repos.ncdu]
bucket = "main"
upstream = "https://code.blicky.net/yorhel/ncdu.git" # pull-mirrored, then pushed to GitHub

[repos.webdriverio]
bucket = "main"
forked_from = "webdriverio/webdriverio"

[repos.recast]
bucket = "main"
forked_from = "benjamn/recast"

[repos."quine-global.github.io"]
bucket = "main"

[repos.homebrew-quintodrome]
bucket = "main"
github = false

[repos.quine-anaconda-webui]
bucket = "main"
github = false

# ── boneyard ─────────────────────────────────────────────────────────────────
[repos.action-gh-release]
bucket = "boneyard"
forked_from = "softprops/action-gh-release"
import = "code"

[repos.electron-builder]
bucket = "boneyard"
